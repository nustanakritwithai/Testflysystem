<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artificial Creature Laboratory</title><style>body{margin:0;background:#071018;color:#dff;font:14px system-ui}header{padding:14px 18px;border-bottom:1px solid #244}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:12px;padding:12px}canvas{width:100%;background:#0b1820;border:1px solid #29404a;border-radius:12px}.panel{background:#0b1820;border:1px solid #29404a;border-radius:12px;padding:12px}.row{display:grid;grid-template-columns:100px 1fr 44px;gap:8px;align-items:center;margin:7px 0}.bar{height:9px;background:#152b34;border-radius:8px;overflow:hidden}.fill{height:100%;background:#70e0c0}button{background:#183a45;color:#dff;border:1px solid #397080;border-radius:8px;padding:9px;margin-right:6px}small{color:#8fb0ba}@media(max-width:760px){main{grid-template-columns:1fr}}</style></head><body><header><b>Artificial Creature Laboratory v0.1</b><br><small>Sensors → Neural Dynamics → Motors → World feedback. No planner / LLM / behavior tree.</small></header><main><section><canvas id="world" width="800" height="520"></canvas><p><button id="reset">Reset</button><button id="food">Move food</button><button id="threat">Move threat</button> <small>เขียว=อาหาร แดง=ภัย ฟ้า=สิ่งมีชีวิต</small></p></section><aside class="panel"><b>Neural activity</b><div id="bars"></div><hr><b>Live state</b><pre id="state"></pre><small>ค่าพฤติกรรมเกิดจาก recurrent leaky-rate network; sensor adapters ป้อน stimulus เท่านั้น ไม่สั่ง action โดยตรง</small></aside></main><script type="module" src="lab.js"></script></body></html>
